<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(to right, #f5f7fa, #c3cfe2);
    }

    .login-container{
      width:350px;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 4px 15px rgba(0,0,0,0.2);
      text-align:center;
    }

    .logo{
      width:90px;
      margin-bottom:15px;
    }

    h2{
      margin-bottom:20px;
      color:#333;
    }

    input{
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      background:#4a90e2;
      color:white;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#357abd;
    }

    .footer{
      margin-top:15px;
      font-size:14px;
      color:#777;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <!-- Logo -->
    <img src="logo.png" alt="Company Logo" class="logo">

    <h2>Login</h2>

    <form>
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <div class="footer">
      © 2026 Your Company
    </div>

  </div>

</body>
</html>
