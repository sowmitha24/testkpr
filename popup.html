<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Popup</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f2f2f2;
    }

    button{
      padding:12px 20px;
      font-size:16px;
      border:none;
      background:#4a90e2;
      color:white;
      border-radius:8px;
      cursor:pointer;
    }

    /* Popup Background */
    .popup{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      justify-content:center;
      align-items:center;
    }

    /* Popup Box */
    .popup-content{
      background:white;
      padding:25px;
      border-radius:10px;
      text-align:center;
      width:300px;
    }

    .close{
      float:right;
      cursor:pointer;
      font-size:20px;
      color:red;
    }
  </style>
</head>

<body>

  <!-- Button -->
  <button onclick="openPopup()">Open Popup</button>

  <!-- Popup -->
  <div class="popup" id="popup">
    <div class="popup-content">

      <span class="close" onclick="closePopup()">&times;</span>

      <h2>Hello 👋</h2>
      <p>This is a simple popup message.</p>

    </div>
  </div>

  <script>
    function openPopup() {
      document.getElementById("popup").style.display = "flex";
    }

    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }
  </script>

</body>
</html>
