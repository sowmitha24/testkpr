<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Search Box</title>

  <style>
    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-family:Arial, sans-serif;
      background:#f2f2f2;
    }

    .search-box{
      display:flex;
      gap:10px;
    }

    input{
      padding:10px;
      width:250px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:16px;
    }

    button{
      padding:10px 15px;
      border:none;
      background:#4a90e2;
      color:white;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div class="search-box">
    <input type="text" placeholder="Search here...">
    <button>Search</button>
  </div>

</body>
</html>
